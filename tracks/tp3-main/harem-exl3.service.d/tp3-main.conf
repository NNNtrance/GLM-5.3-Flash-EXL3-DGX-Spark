# /etc/systemd/system/harem-exl3.service.d/tp3-main.conf
#
# For a node that already has the old tracks/tp3 unit (harem-exl3.service, the container
# name exl3-tp3, the watchdog and any firewall rule written against them): keep the unit and
# its name, and switch the stack with this drop-in. Nothing that watches the unit or the
# container has to change.
#
# Install: remove or rename any older drop-in that sets ENV_FILE (it would define it twice),
# copy this file, replace @USER@/@HOME@, `sudo systemctl daemon-reload`.
# Roll back: remove this file and daemon-reload; the old unit text takes over again.
#
# An empty `ExecStartPre=` / `ExecStart=` / `ExecStop=` line clears what the base unit set;
# without it systemd would run the old command as well as the new one.
[Unit]
Description=GLM-5.3-Flash EXL3 engine (tp3-main: vLLM 21d93d0d8 + cuda-exl3 448f1d6, TP=3 + EP, vision)
[Service]
Environment=ENV_FILE=@HOME@/exl3-main/.env.tp3-main
WorkingDirectory=@HOME@/exl3-main
ExecStartPre=
ExecStartPre=/bin/bash @HOME@/exl3-main/bin/preflight-tp3-main.sh
ExecStart=
ExecStart=/bin/bash @HOME@/exl3-main/bin/start-tp3-main.sh
ExecStop=
ExecStop=/bin/bash -c 'docker logs exl3-tp3 > @HOME@/exl3-main/log/stop-$$(date +%%Y%%m%%d-%%H%%M%%S).log 2>&1; docker stop -t 90 exl3-tp3'
TimeoutStartSec=1500
